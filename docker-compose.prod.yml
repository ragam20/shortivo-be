name: shortivo-prod

services:
  api:
    image: your-dockerhub/shortivo-api:1.0.0
    container_name: shortivo-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8000
      DATABASE_HOST: ${DB_HOST}
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      DATABASE_SSLMODE: ${DB_SSLMODE} 
      DATABASE_TIME_ZONE: ${DB_TIME_ZONE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - 8000:8000"

  postgres:
    image: postgres:16-alpine
    container_name: shortivo-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${DB_TIME_ZONE}
    volumes:
      - shortivo-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortivo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shortivo-redis-prod
    restart: unless-stopped
    volumes:
      - shortivo-redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  shortivo-postgres-prod-data:
  shortivo-redis-prod-data:
